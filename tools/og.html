<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Better Call Jev · og:image source</title>
<!--
  Source for site/og.png (1200×630). Render it with:
    node tools/og.mjs
  Keep the headline and the answer line in step with the hero in site/index.html.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wdth,wght@6..144,25..151,1..1000&family=Hanken+Grotesk:wght@400;600&family=Spline+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fdfdfc;
    --plane: #d9d8d4;
    --mid: #ababa6;
    --ink-2: #716b62;
    --ink: #272821;
    --signal: #c03d24;
    --f-display: "Google Sans Flex", "Hanken Grotesk", sans-serif;
    --f-text: "Hanken Grotesk", sans-serif;
    --f-mono: "Spline Sans Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 1200px; height: 630px; overflow: hidden;
    background: var(--paper); color: var(--ink); font-family: var(--f-text);
  }
  .card { width: 1200px; height: 630px; padding: 56px 64px 0; position: relative; }
  .label {
    font-family: var(--f-display); font-variation-settings: "wght" 500, "wdth" 112.5;
    font-size: 17px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2);
  }
  h1 {
    font-family: var(--f-display); font-variation-settings: "wght" 600, "wdth" 75; font-weight: 600;
    font-size: 80px; line-height: 1.02; letter-spacing: -.01em; margin: 18px 0 0;
  }
  .row {
    position: absolute; left: 64px; right: 64px; top: 390px;
    display: grid; grid-template-columns: 1.15fr 1fr; gap: 0 56px;
  }
  .cap {
    font-family: var(--f-display); font-variation-settings: "wght" 500, "wdth" 112.5;
    font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2);
    padding-bottom: 10px; border-bottom: 1px solid var(--ink); margin-bottom: 18px;
  }
  .para .cap { border-bottom-color: var(--mid); }
  .answer { font-family: var(--f-mono); font-size: 38px; line-height: 1.2; letter-spacing: -.01em; white-space: nowrap; }
  .sig { color: var(--signal); }
  .act { margin-top: 12px; font-size: 21px; line-height: 1.3; }
  .act::before { content: "→ "; color: var(--ink-2); }
  .bars i {
    display: block; height: 11px; margin-bottom: 13px;
    background-size: 610px 100%;
    background-image: linear-gradient(90deg,
      var(--plane) 0 38px, transparent 38px 44px,
      var(--plane) 44px 66px, transparent 66px 72px,
      var(--plane) 72px 133px, transparent 133px 139px,
      var(--plane) 139px 156px, transparent 156px 162px,
      var(--plane) 162px 206px, transparent 206px 212px,
      var(--plane) 212px 241px, transparent 241px 247px,
      var(--plane) 247px 317px, transparent 317px 323px,
      var(--plane) 323px 348px, transparent 348px 354px,
      var(--plane) 354px 387px, transparent 387px 393px,
      var(--plane) 393px 445px, transparent 445px 451px,
      var(--plane) 451px 470px, transparent 470px 476px,
      var(--plane) 476px 517px, transparent 517px 523px,
      var(--plane) 523px 550px, transparent 550px 556px,
      var(--plane) 556px 604px, transparent 604px 610px);
  }
  .bars i:nth-child(2) { background-position-x: -247px; width: 96%; }
  .bars i:nth-child(3) { background-position-x: -451px; width: 99%; }
  .bars i:nth-child(4) { background-position-x: -72px; width: 58%; }
  .foot {
    position: absolute; left: 64px; right: 64px; bottom: 0; height: 64px;
    border-top: 3px solid var(--ink); display: flex; justify-content: space-between; align-items: center;
    font-size: 19px;
  }
  .foot b { font-family: var(--f-display); font-variation-settings: "wght" 600, "wdth" 75; font-weight: 600; font-size: 22px; }
  .foot span { color: var(--ink-2); }
</style>
</head>
<body>
<div class="card">
  <p class="label" style="margin:0">Claude Code plugin</p>
  <h1>Give Jev the evidence<br>and a bounded question.<br>Act on the number.</h1>

  <div class="row">
    <div>
      <p class="cap" style="margin-top:0">A calibrated probability</p>
      <p class="answer" style="margin:0">refund undecided <span class="sig">.31</span></p>
      <p class="act" style="margin-bottom:0">Not acting on it as a refund request — asking what they want.</p>
    </div>
    <div class="para">
      <p class="cap" style="margin-top:0">instead of a paragraph</p>
      <div class="bars"><i></i><i></i><i></i><i></i></div>
    </div>
  </div>

  <div class="foot"><b>Better Call Jev</b><span>bettercalljev.com</span></div>
</div>
</body>
</html>
